[package]
name = "swupdate-ipc"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust client for the SWUpdate IPC and progress protocols"
authors = ["Ezurio LLC"]
license = "Ezurio-Clause"

[features]
# Async (tokio) client API. The blocking (std) API is always available.
async = ["dep:tokio", "dep:futures-util"]

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"], optional = true }
futures-util = { workspace = true, default-features = false, features = ["std"], optional = true }

[lib]
crate-type = ["rlib"]
