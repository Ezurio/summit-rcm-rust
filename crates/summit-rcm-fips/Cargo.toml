[package]
name = "summit-rcm-fips"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Summit RCM FIPS plugin"
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "summit_rcm_fips"
path = "src/lib.rs"

[features]
fips = []
# Interface gates: forwarded from the umbrella, mirrored to web for standalone
# consistency.
api-v2 = ["dep:summit-rcm-web", "summit-rcm-web/api-v2"]
api-legacy = ["dep:summit-rcm-web", "summit-rcm-web/api-legacy"]
at-interface = ["dep:summit-rcm-at", "dep:summit-rcm-system", "summit-rcm-system/at-interface"]
api-docs = ["dep:summit-rcm-web", "summit-rcm-web/api-docs"]

[dependencies]
summit-rcm-core = { path = "../summit-rcm-core" }
summit-rcm-web = { path = "../summit-rcm-web", optional = true }
summit-rcm-at = { path = "../summit-rcm-at", optional = true }
summit-rcm-system = { path = "../summit-rcm-system", optional = true }
inventory.workspace = true
anyhow.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
