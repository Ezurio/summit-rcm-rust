[package]
name = "summit-rcm-awm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Summit RCM AWM (Adaptive Wi-Fi Manager) plugin"
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "summit_rcm_awm"
path = "src/lib.rs"

[features]
awm = []
# Interface gates: forwarded from the umbrella and mirrored to
# `summit-rcm-web` for standalone/`-p` builds.
api-v2 = ["dep:summit-rcm-web", "summit-rcm-web/api-v2"]
api-legacy = ["dep:summit-rcm-web", "summit-rcm-web/api-legacy"]
at-interface = ["dep:summit-rcm-at"]
api-docs = ["dep:summit-rcm-web", "summit-rcm-web/api-docs"]

[dependencies]
summit-rcm-core = { path = "../summit-rcm-core" }
summit-rcm-web = { path = "../summit-rcm-web", optional = true }
summit-rcm-at = { path = "../summit-rcm-at", optional = true }
inventory.workspace = true
anyhow.workspace = true
configparser = { workspace = true, features = ["tokio"] }
log.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
