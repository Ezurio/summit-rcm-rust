[package]
name = "summit-rcm-bluetooth-hid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Summit RCM Bluetooth HID device plugin"
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "summit_rcm_bluetooth_hid"
path = "src/lib.rs"

[features]
api-v2 = ["dep:summit-rcm-web", "summit-rcm-bluetooth/api-v2"]
api-legacy = ["dep:summit-rcm-web", "summit-rcm-bluetooth/api-legacy"]
api-docs = ["summit-rcm-bluetooth/api-docs", "dep:summit-rcm-web", "summit-rcm-web/api-docs"]

[dependencies]
summit-rcm-core = { path = "../summit-rcm-core" }
summit-rcm-bluetooth = { path = "../summit-rcm-bluetooth" }
summit-rcm-web = { path = "../summit-rcm-web", optional = true }
anyhow.workspace = true
futures-util = { workspace = true, default-features = false, features = ["std", "sink"] }
inventory.workspace = true
log.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-udev.workspace = true
zbus = { workspace = true, default-features = false, features = ["tokio"] }

[dev-dependencies]
summit-rcm-core = { path = "../summit-rcm-core", features = ["test-support"] }

[[test]]
name = "live_hid"
path = "tests/live_hid.rs"
