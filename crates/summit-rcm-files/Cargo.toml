[package]
name = "summit-rcm-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Summit RCM files plugin"
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "summit_rcm_files"
path = "src/lib.rs"

[features]
files = []
network-manager = ["dep:summit-rcm-network-manager"]
# Interface gates: forwarded from the umbrella, mirrored to web and the
# network-manager dependency for standalone consistency.
api-v2 = ["dep:summit-rcm-web", "summit-rcm-web/api-v2", "summit-rcm-network-manager?/api-v2"]
api-legacy = ["dep:summit-rcm-web", "summit-rcm-web/api-legacy", "summit-rcm-network-manager?/api-legacy"]
at-interface = ["dep:summit-rcm-at", "summit-rcm-network-manager?/at-interface"]
api-docs = ["dep:summit-rcm-web", "summit-rcm-web/api-docs", "summit-rcm-network-manager?/api-docs"]

[dependencies]
summit-rcm-core = { path = "../summit-rcm-core" }
summit-rcm-web = { path = "../summit-rcm-web", optional = true }
summit-rcm-at = { path = "../summit-rcm-at", optional = true }
inventory.workspace = true
summit-rcm-network-manager = { path = "../summit-rcm-network-manager", optional = true }
anyhow.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# Colocated route tests drive the handlers through a minimal axum router.
tower = { workspace = true, features = ["util"] }
