[workspace]
members = [
    ".",
    "crates/generate-nl80211",
    "crates/plugin-api",
    "crates/plugin-example",
    "crates/swupdate-ipc",
]

[package]
name = "summit-rcm"
version = "0.1.0"
edition = "2024"
description = "Summit RCM - Remote Configuration Manager (Rust/Axum port)"
authors = ["Ezurio LLC"]
license = "LicenseRef-Ezurio-Clause"
autotests = false

[[bin]]
name = "generate_openapi"
path = "src/openapi/generate.rs"
required-features = ["api-docs"]

[[test]]
name = "at_lookup"
path = "tests/at_lookup.rs"

[[test]]
name = "legacy_response"
path = "tests/legacy_response.rs"

[[test]]
name = "logs"
path = "tests/logs.rs"
required-features = ["logs"]

[[test]]
name = "shutdown"
path = "tests/shutdown.rs"

[[test]]
name = "plugin_registry"
path = "tests/plugin_registry.rs"

[[test]]
name = "plugins"
path = "tests/plugins.rs"

[[test]]
name = "cww"
path = "tests/cww.rs"
required-features = ["cww"]

[[test]]
name = "at_basic"
path = "tests/at_basic.rs"
required-features = ["at-interface"]

[[test]]
name = "no_dead_code_policy"
path = "tests/unit/no_dead_code_policy.rs"

[features]
# Default: full REST API (v2 + legacy routes)
default = ["api-v2", "api-legacy"]

# Shared REST server stack used by both published HTTP APIs.
api-rest = [
    "dep:axum",
    "dep:libloading", "dep:tower-sessions", "dep:hyper-util", "tokio/net",
]

# REST API v2 routes (/api/v2/...) — pulls in Axum automatically
api-v2 = [
    "api-rest",
    "network", "network-manager", "date-time", "login", "system", "logs", "files", "update",
]
# Legacy API routes (/api/v1/... and root-path backward-compat) — same Axum stack
api-legacy = [
    "api-rest",
    "network", "network-manager", "date-time", "login", "system", "logs", "files", "update",
]
# Serial AT command interface — independent of any REST API
at-interface = ["dep:tokio-serial", "dep:ping", "dep:httparse", "tokio/net", "network", "network-manager", "date-time", "system", "logs", "files", "update"]

# NetworkManager-backed implementation used by the network plugin.
network-manager = []

# Network-facing routes, AT commands, and non-NetworkManager helpers.
network = ["dep:neli", "dep:neli-proc-macros", "neli/async"]
date-time = []
login = ["dep:rustix"]
system = []
logs = []
files = []
update = ["dep:swupdate-ipc", "swupdate-ipc/async"]
cww = []

# Optional plugins — fully independent; no interface implied.
# Routes are wired only when the matching interface feature is also active:
#   plugin + api-v2     → v2 routes
#   plugin + api-legacy → legacy routes
#   plugin + at-interface → AT commands
awm             = []
bluetooth       = []
# Bluetooth subfeatures — standalone device plugins that extend the bluetooth
# plugin's service surface, so they require the bluetooth plugin itself.
bluetooth-hid   = ["bluetooth", "dep:tokio-udev"]
bluetooth-vsp   = ["bluetooth"]
bluetooth-websocket = ["bluetooth", "notifications"]
# Application-wide websocket notification channel (payload-agnostic transport).
notifications = ["axum/ws"]
chrony          = []
fips            = []
firewall        = []
log-forwarding  = []
provisioning    = ["dep:rustix", "date-time"]
radio-siso-mode = []
stunnel         = []
unauthenticated = []
all-plugins = [
    "awm", "bluetooth", "chrony", "cww", "fips", "firewall", "log-forwarding",
    "provisioning", "radio-siso-mode", "stunnel", "unauthenticated",
    "network", "network-manager", "date-time", "login", "system", "logs", "files", "update",
]
api-docs = ["dep:utoipa", "api-v2", "api-legacy"]
runtime-docs = []
swagger-ui = ["runtime-docs"]

[dependencies]
# Always required
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
configparser = { version = "3", features = ["async-std"] }
hex = "0.4"
log = "0.4"
env_filter = { version = "1.0.1", default-features = false }
systemd-journal-logger = "2.2.2"
tracing = { version = "0.1.44", default-features = false, features = ["release_max_level_off"] }
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
zbus = { version = "5.16.0", default-features = false, features = ["tokio"] }
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
libc = "0.2"
rustix = { version = "1", features = ["time", "fs"], optional = true }
openssl = "0.10"
openssl-sys = "0.9"
tokio-openssl = "0.6"
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"], optional = true }
ping           = { version = "0.7", optional = true }
summit-rcm-plugin-api = { path = "crates/plugin-api" }
swupdate-ipc = { path = "crates/swupdate-ipc", features = ["async"], optional = true }
neli = { version = "0.7.4", default-features = false, features = ["async"], optional = true }
neli-proc-macros = { version = "0.2.2", optional = true }
tokio-udev = { version = "0.10.0", optional = true }

# REST API dependencies (enabled by api-v2 and/or api-legacy)
axum           = { version = "0.8.9", features = ["multipart"], optional = true }
libloading     = { version = "0.9.0", optional = true }
tower-sessions = { version = "0.15.0", optional = true }

# AT interface (feature = "at-interface")
tokio-serial   = { version = "5", optional = true }
httparse       = { version = "1", optional = true }

utoipa         = { version = "5.5.0", features = ["axum_extras"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"

[profile.dev]
incremental = true

[profile.test]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
