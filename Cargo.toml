[workspace]
resolver = "3"
members = [
    ".",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ezurio LLC"]
license = "Ezurio-Clause"

[workspace.metadata.summit-rcm]
public-version = "0.0.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_results = "deny"
warnings = "deny"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[package]
name = "summit-rcm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Summit RCM - Remote Configuration Manager (Rust/Axum port)"
authors.workspace = true
license.workspace = true
autotests = false

[lib]
name = "summit_rcm"
path = "src/lib.rs"

[[bin]]
name = "summit-rcm"
path = "src/main.rs"

[[bin]]
name = "generate_openapi"
path = "src/bin/generate_openapi.rs"
required-features = ["api-docs"]

# The binary is a transparent feature aggregator: each interface feature forwards
# to the shared `summit-rcm-core` crate, the common web/AT hubs, and every
# enabled plugin crate (via the optional `crate?/feature` form); each plugin
# feature pulls in that plugin's crate. The manifest dependency list is the
# single source of truth for which plugins exist — build.rs derives the
# link-retention list from it.
[features]
default = ["api-v2", "api-legacy"]

api-v2 = [
    "summit-rcm-core/api-v2",
    "summit-rcm-web/api-v2",
    "summit-rcm-awm?/api-v2",
    "summit-rcm-bluetooth?/api-v2",
    "summit-rcm-bluetooth-hid?/api-v2",
    "summit-rcm-bluetooth-vsp?/api-v2",
    "summit-rcm-chrony?/api-v2",
    "summit-rcm-cww?/api-v2",
    "summit-rcm-date-time?/api-v2",
    "summit-rcm-files?/api-v2",
    "summit-rcm-fips?/api-v2",
    "summit-rcm-firewall?/api-v2",
    "summit-rcm-log-forwarding?/api-v2",
    "summit-rcm-login?/api-v2",
    "summit-rcm-logs?/api-v2",
    "summit-rcm-network?/api-v2",
    "summit-rcm-network-manager?/api-v2",
    "summit-rcm-provisioning?/api-v2",
    "summit-rcm-radio-siso-mode?/api-v2",
    "summit-rcm-stunnel?/api-v2",
    "summit-rcm-system?/api-v2",
    "summit-rcm-unauthenticated?/api-v2",
    "summit-rcm-update?/api-v2",
]
api-legacy = [
    "summit-rcm-core/api-legacy",
    "summit-rcm-web/api-legacy",
    "summit-rcm-awm?/api-legacy",
    "summit-rcm-bluetooth?/api-legacy",
    "summit-rcm-bluetooth-hid?/api-legacy",
    "summit-rcm-bluetooth-vsp?/api-legacy",
    "summit-rcm-chrony?/api-legacy",
    "summit-rcm-cww?/api-legacy",
    "summit-rcm-date-time?/api-legacy",
    "summit-rcm-files?/api-legacy",
    "summit-rcm-fips?/api-legacy",
    "summit-rcm-firewall?/api-legacy",
    "summit-rcm-log-forwarding?/api-legacy",
    "summit-rcm-login?/api-legacy",
    "summit-rcm-logs?/api-legacy",
    "summit-rcm-network?/api-legacy",
    "summit-rcm-network-manager?/api-legacy",
    "summit-rcm-provisioning?/api-legacy",
    "summit-rcm-radio-siso-mode?/api-legacy",
    "summit-rcm-stunnel?/api-legacy",
    "summit-rcm-system?/api-legacy",
    "summit-rcm-unauthenticated?/api-legacy",
    "summit-rcm-update?/api-legacy",
]
at-interface = [
    "summit-rcm-core/at-interface",
    "summit-rcm-at/at-interface",
    "summit-rcm-awm?/at-interface",
    "summit-rcm-chrony?/at-interface",
    "summit-rcm-date-time?/at-interface",
    "summit-rcm-files?/at-interface",
    "summit-rcm-fips?/at-interface",
    "summit-rcm-log-forwarding?/at-interface",
    "summit-rcm-logs?/at-interface",
    "summit-rcm-network?/at-interface",
    "summit-rcm-network-manager?/at-interface",
    "summit-rcm-radio-siso-mode?/at-interface",
    "summit-rcm-system?/at-interface",
    "summit-rcm-update?/at-interface",
]

# Plugin features — each only pulls in the matching plugin crate. The umbrella
# interface features above decide which API/AT/doc surfaces are enabled, so
# these plugin selectors never spell out interface layers themselves.
awm          = ["dep:summit-rcm-awm"]
chrony       = ["dep:summit-rcm-chrony"]
cww          = ["dep:summit-rcm-cww"]
date-time    = ["dep:summit-rcm-date-time"]
files        = ["dep:summit-rcm-files"]
fips         = ["dep:summit-rcm-fips"]
firewall     = ["dep:summit-rcm-firewall"]
log-forwarding = ["dep:summit-rcm-log-forwarding"]
login        = ["dep:summit-rcm-login"]
logs         = ["dep:summit-rcm-logs"]
network      = ["dep:summit-rcm-network"]
network-manager = ["dep:summit-rcm-network-manager", "summit-rcm-files?/network-manager"]
provisioning = ["dep:summit-rcm-provisioning"]
radio-siso-mode = ["dep:summit-rcm-radio-siso-mode"]
stunnel      = ["dep:summit-rcm-stunnel"]
system       = ["dep:summit-rcm-system"]
unauthenticated = ["dep:summit-rcm-unauthenticated"]
update       = ["dep:summit-rcm-update"]

# Bluetooth plugin plus HID/VSP device-profile plugins. HID/VSP depend on the
# shared Bluetooth plugin, but bluetooth itself must not imply HID/VSP.
bluetooth = ["dep:summit-rcm-bluetooth"]
bluetooth-hid = [
    "bluetooth",
    "dep:summit-rcm-bluetooth-hid",
]
bluetooth-vsp = [
    "bluetooth",
    "dep:summit-rcm-bluetooth-vsp",
]
bluetooth-websocket = ["bluetooth", "summit-rcm-bluetooth/bluetooth-websocket", "notifications"]
notifications = ["summit-rcm-web?/notifications"]

all-plugins = [
    "awm", "bluetooth", "chrony", "cww", "fips", "firewall", "log-forwarding",
    "provisioning", "radio-siso-mode", "stunnel", "unauthenticated",
    "network", "network-manager", "date-time", "login", "system", "logs", "files", "update",
]
# API documentation generation. Like the other interface features, this is
# forwarded from the umbrella to every enabled doc-capable child crate. That
# lets each child keep `utoipa` optional so non-doc builds do not pull it
# in, while any external plugin still needs explicit root-manifest wiring.
api-docs = [
    "summit-rcm-core/api-docs",
    "summit-rcm-web/api-docs",
    "summit-rcm-awm?/api-docs",
    "summit-rcm-bluetooth?/api-docs",
    "summit-rcm-bluetooth-hid?/api-docs",
    "summit-rcm-bluetooth-vsp?/api-docs",
    "summit-rcm-chrony?/api-docs",
    "summit-rcm-cww?/api-docs",
    "summit-rcm-date-time?/api-docs",
    "summit-rcm-files?/api-docs",
    "summit-rcm-fips?/api-docs",
    "summit-rcm-firewall?/api-docs",
    "summit-rcm-log-forwarding?/api-docs",
    "summit-rcm-login?/api-docs",
    "summit-rcm-logs?/api-docs",
    "summit-rcm-network?/api-docs",
    "summit-rcm-network-manager?/api-docs",
    "summit-rcm-provisioning?/api-docs",
    "summit-rcm-radio-siso-mode?/api-docs",
    "summit-rcm-stunnel?/api-docs",
    "summit-rcm-system?/api-docs",
    "summit-rcm-unauthenticated?/api-docs",
    "summit-rcm-update?/api-docs",
]
swagger-ui = ["summit-rcm-web?/swagger-ui"]

# Enables the cross-crate test-support seams (configuration overrides and the
# login boot-time override) used by the application integration tests in
# `tests/app.rs`. Intended for `cargo test` only.
test-support = ["summit-rcm-core/test-support", "summit-rcm-login?/test-support"]

[workspace.dependencies]
# Versions declared once here; workspace members reference them with .workspace = true
tokio          = "1"
bytes          = "1"
serde          = "1"
serde_json     = "1"
configparser   = "3"
hex            = "0.4"
log            = "0.4"
env_filter     = { version = "2", default-features = false }
systemd-journal-logger = "2.2.2"
tracing        = "0.1.44"
anyhow         = "1"
futures-util   = { version = "0.3", default-features = false }
zbus           = { version = "5.18.0", default-features = false }
base64         = "0.22"
time           = "0.3"
rustix         = "1"
openssl        = "0.10"
openssl-sys    = "0.9"
tokio-openssl  = "0.6"
inventory      = "0.3"
# `utoipa` stays optional in child crates so ungated OpenAPI derives fail to
# compile when docs are off while the dependency itself stays out of non-doc
# builds.
utoipa         = "5.5.0"
axum           = "0.8.9"
tower          = "0.5"
tower-sessions = "0.15.0"
hyper          = "1"
http-body-util = "0.1"
hyper-util     = "0.1"
tokio-tungstenite = "0.30"
tokio-udev = "0.10.0"
serial2-tokio  = "0.1"
ping           = "0.9"
ureq           = { version = "~3.3", default-features = false }
rustix-openpty = "0.2"
bindgen        = "0.72"
neli           = { version = "0.7.4", default-features = false }
thiserror      = "2"

[dependencies]
summit-rcm-core = { path = "crates/summit-rcm-core", default-features = false }
summit-rcm-web = { path = "crates/summit-rcm-web", optional = true, default-features = false }
summit-rcm-at = { path = "crates/summit-rcm-at", optional = true, default-features = false }
summit-rcm-awm = { path = "crates/summit-rcm-awm", optional = true, default-features = false }
summit-rcm-bluetooth = { path = "crates/summit-rcm-bluetooth", optional = true, default-features = false }
summit-rcm-bluetooth-hid = { path = "crates/summit-rcm-bluetooth-hid", optional = true, default-features = false }
summit-rcm-bluetooth-vsp = { path = "crates/summit-rcm-bluetooth-vsp", optional = true, default-features = false }
summit-rcm-chrony = { path = "crates/summit-rcm-chrony", optional = true, default-features = false }
summit-rcm-cww = { path = "crates/summit-rcm-cww", optional = true, default-features = false }
summit-rcm-date-time = { path = "crates/summit-rcm-date-time", optional = true, default-features = false }
summit-rcm-files = { path = "crates/summit-rcm-files", optional = true, default-features = false }
summit-rcm-fips = { path = "crates/summit-rcm-fips", optional = true, default-features = false }
summit-rcm-firewall = { path = "crates/summit-rcm-firewall", optional = true, default-features = false }
summit-rcm-log-forwarding = { path = "crates/summit-rcm-log-forwarding", optional = true, default-features = false }
summit-rcm-login = { path = "crates/summit-rcm-login", optional = true, default-features = false }
summit-rcm-logs = { path = "crates/summit-rcm-logs", optional = true, default-features = false }
summit-rcm-network = { path = "crates/summit-rcm-network", optional = true, default-features = false }
summit-rcm-network-manager = { path = "crates/summit-rcm-network-manager", optional = true, default-features = false }
summit-rcm-provisioning = { path = "crates/summit-rcm-provisioning", optional = true, default-features = false }
summit-rcm-radio-siso-mode = { path = "crates/summit-rcm-radio-siso-mode", optional = true, default-features = false }
summit-rcm-stunnel = { path = "crates/summit-rcm-stunnel", optional = true, default-features = false }
summit-rcm-system = { path = "crates/summit-rcm-system", optional = true, default-features = false }
summit-rcm-unauthenticated = { path = "crates/summit-rcm-unauthenticated", optional = true, default-features = false }
summit-rcm-update = { path = "crates/summit-rcm-update", optional = true, default-features = false }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
log.workspace = true
env_filter = { workspace = true, default-features = false }
systemd-journal-logger.workspace = true
anyhow.workspace = true
futures-util = { workspace = true, default-features = false, features = ["std", "sink"] }
serde_json.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true, features = ["util"] }
tokio-tungstenite.workspace = true
bytes.workspace = true
zbus = { workspace = true, default-features = false, features = ["tokio"] }
rustix = { workspace = true, features = ["fs", "termios", "process"] }
rustix-openpty.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true

[profile.dev]
incremental = true

[profile.test]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[test]]
name = "app"
path = "tests/app.rs"

[[test]]
name = "shutdown"
path = "tests/shutdown.rs"

[[test]]
name = "no_dead_code_policy"
path = "tests/no_dead_code_policy.rs"
